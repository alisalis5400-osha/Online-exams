<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بنك التدريبات التفاعلي الشامل - الدراسات الاجتماعية</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f4f8; margin: 0; padding: 15px; display: flex; justify-content: center; }
        .quiz-card { background-color: #ffffff; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 600px; padding: 25px; }
        .header { text-align: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; margin-bottom: 20px; }
        .header h2 { color: #1e293b; margin: 0 0 5px 0; font-size: 1.5rem; }
        .header p { color: #64748b; margin: 0; font-size: 0.95rem; }
        
        .student-info-box { background: #f8fafc; padding: 20px; border-radius: 12px; border: 1px solid #cbd5e1; text-align: center; margin-bottom: 20px; }
        .student-info-box label { font-size: 1.1rem; font-weight: bold; color: #1e293b; display: block; margin-bottom: 10px; }
        .student-info-box input { width: 100%; max-width: 350px; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; text-align: center; outline: none; }
        .start-btn { background-color: #2563eb; color: white; border: none; padding: 12px 30px; border-radius: 8px; font-size: 1.05rem; font-weight: bold; cursor: pointer; margin-top: 15px; transition: 0.2s; }
        .start-btn:hover { background-color: #1d4ed8; }

        .quiz-body { display: none; }
        .controls { display: flex; justify-content: space-between; align-items: center; background: #f1f5f9; padding: 12px 15px; border-radius: 10px; margin-bottom: 20px; font-weight: bold; color: #334155; }
        .timer-box { color: #dc2626; }
        
        .question-title { font-size: 1.15rem; font-weight: bold; color: #0f172a; margin-bottom: 15px; line-height: 1.6; }
        textarea { width: 100%; height: 90px; padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 1rem; resize: none; outline: none; margin-bottom: 15px; }
        textarea:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2); }
        .submit-btn { background-color: #2563eb; color: white; border: none; padding: 12px 25px; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; width: 100%; transition: 0.2s; }
        .submit-btn:hover { background-color: #1d4ed8; }
        .feedback-box { display: none; margin-top: 20px; padding: 15px; border-radius: 10px; font-size: 1rem; line-height: 1.6; }
        .feedback-correct { background-color: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .feedback-incorrect { background-color: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        .next-btn { background-color: #059669; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-size: 1rem; cursor: pointer; margin-top: 10px; float: left; }

        .result-card { display: none; background: #f8fafc; border-radius: 12px; padding: 20px; border: 2px solid #e2e8f0; text-align: center; }
        .score-badge { font-size: 1.8rem; font-weight: bold; color: #2563eb; margin-bottom: 15px; }
        .weakness-box { background: #ffffff; padding: 15px; border-radius: 10px; border-right: 4px solid #ef4444; margin-top: 15px; text-align: right; }
        .weakness-list ul { margin: 5px 0 0 0; padding-right: 20px; }
    </style>
</head>
<body>

<div class="quiz-card">
    <div class="header">
        <h2>🎯 بنك التدريبات التفاعلي الشامل</h2>
        <p>الصف السادس الابتدائي - الدراسات الاجتماعية (30 سؤالاً)</p>
    </div>

    <!-- مرحلة إدخال اسم الطالب -->
    <div id="student-section" class="student-info-box">
        <label for="student-name">👤 أدخل اسم الطالب الخماسي:</label>
        <input type="text" id="student-name" placeholder="اكتب اسمك هنا...">
        <br>
        <button class="start-btn" onclick="startQuiz()">🚀 ابدأ الاختبار الآن</button>
    </div>

    <!-- جسم الامتحان -->
    <div id="quiz-section" class="quiz-body">
        <div class="controls">
            <span>👤 الطالب: <span id="student-display" style="color: #1e293b;"></span></span>
            <span>السؤال <span id="q-counter">1</span> من 30</span>
            <span class="timer-box">⏱️ المتبقي: <span id="timer">45</span> ثانية</span>
        </div>

        <div class="question-title" id="question-text">جاري تحميل السؤال...</div>

        <textarea id="user-answer" placeholder="اكتب إجابتك هنا بوضوح..."></textarea>

        <button class="submit-btn" id="submit-btn" onclick="checkAnswer()">🚀 إرسال الإجابة للتصحيح</button>

        <div class="feedback-box" id="feedback"></div>
    </div>

    <!-- تقرير النتيجة النهائي -->
    <div id="result-section" class="result-card">
        <h2>🏆 النتيجة النهائية</h2>
        <div class="score-badge" id="final-score"></div>
        <p id="student-final-name" style="font-weight: bold; font-size: 1.1rem; color: #334155;"></p>
        <div id="weakness-area" class="weakness-box">
            <strong style="color: #991b1b;">📌 النقاط التي تحتاج إلى مراجعة وتثبيت:</strong>
            <div class="weakness-list" id="weakness-list"></div>
        </div>
    </div>
</div>

<script>
    const quizData = [
        { q: "س1: أعلى قمة جبلية في الوطن العربي هي قمة جبل ............", a: ["توبقال", "جبل توبقال"], note: "قمة جبل توبقال تقع في دولة المغرب بشمال أفريقيا." },
        { q: "س2: يحد الوطن العربي من جهة الشرق خضوعاً لثلاثة مظاهر مائية منها الخليج العربي وخليج عُمان وبحر ............", a: ["العرب", "بحر العرب"], note: "الحدود الشرقية للوطن العربي تطل على الخليج العربي، خليج عمان، وبحر العرب." },
        { q: "س3: الممر المائي الذي يربط بين البحر الأحمر والبحر المتوسط هو ............", a: ["قناة السويس", "قناه السويس"], note: "قناة السويس هي ممر مائي مصري استراتيجي يربط البحرين الأحمر والمتوسط." },
        { q: "س4: تقع جبال زاجروس في جهة ............ بالنسبة للوطن العربي.", a: ["الشمال الشرقي", "شمال شرق"], note: "جبال زاجروس وكردستان تمثل الحدود الشمالية الشرقية للوطن العربي." },
        { q: "س5: السهول التي كونتها الأنهار عن طريق ترسيب المواد المعلقة بمياهها تسمى سهولاً ............", a: ["فيضية", "فيضيه", "الفيضية"], note: "السهول الفيضية تتكون بواسطة الأنهار مثل نهر النيل ونشأة الزراعة عليها." },
        { q: "س6: أكبر دولة عربية من حيث المساحة هي دولة ............", a: ["الجزائر"], note: "الجزائر هي أكبر الدول العربية والإفريقية مساحة." },
        { q: "س7: أصغر دولة عربية من حيث المساحة هي دولة ............", a: ["البحرين"], note: "البحرين هي أصغر دولة عربية من حيث المساحة وتقع في الخليج العربي." },
        { q: "س8: يمر بالطرف الجنوبي للوطن العربي خط الاستواء بينما يمر بمنتصفه مدار ............", a: ["السرطان", "مدار السرطان"], note: "يمر مدار السرطان في الجزء الأوسط من الوطن العربي." },
        { q: "س9: هضبة تقع في جنوب شبه الجزيرة العربية هي هضبة ............", a: ["حضرموت"], note: "هضبة حضرموت تقع في جنوب شبه الجزيرة العربية بدولة اليمن." },
        { q: "س10: توجد هضبة بادية الشام في ............ شبه الجزيرة العربية.", a: ["شمال"], note: "بادية الشام في الشمال، نجد في الوسط، وحضرموت في الجنوب." },
        { q: "س11: تقع سلاسل جبال أطلس في أقصى ............ للوطن العربي.", a: ["الشمال الغربي", "شمال غرب"], note: "جبال أطلس تقع في أقصى شمال غرب الوطن العربي وتمر بالمغرب والجزائر وتونس." },
        { q: "س12: المناخ السائد في معظم أراضي الوطن العربي هو المناخ ............", a: ["الصحراوي", "الصحراوي الحار"], note: "يشغل الإقليم الصحراوي نحو 80% من مساحة الوطن العربي." },
        { q: "س13: تعتمد الزراعة في الواجهات الساحلية لشمال الوطن العربي على مياه ............", a: ["الأمطار", "الامطار", "امطار الشتاء"], note: "تسقط الأمطار الشتوية على الأجزاء الشمالية المطلة على البحر المتوسط." },
        { q: "س14: الأراضي التي تتميز بجفافها وقلة أمطارها وتدهور قدرتها الإنتاجية تسمى بمشكلة ............", a: ["التصحر", "تصحر"], note: "التصحر هو تناقص قدرة الأرض الإنتاجية ويشهد زيادة بالوطن العربي." },
        { q: "س15: تمتد جبال البحر الأحمر في جناحين هما الجناح الآسيوي والجناح ............", a: ["الأفريقي", "الافريقي"], note: "تسمى جبال البحر الأحمر في الجناح الأفريقي بمصر والسودان بجبال البحر الأحمر." },
        { q: "س16: تسمى جبال البحر الأحمر في السعودية بجبال الحجاز و ............", a: ["عسير", "جبال عسير"], note: "تمتد في السعودية تحت اسم جبال الحجاز وجبال عسير وإقليم عسير." },
        { q: "س17: واحة تقع في مصر وتعتمد على المياه الجوفية وتوجد بها زراعة هي واحة ............", a: ["سيوة", "سيوه"], note: "واحة سيوة من أشهر الواحات المأهولة بالسكان والزراعة في مصر." },
        { q: "س18: من المضايق التي تشرف عليها دولة المغرب وإسبانيا هو مضيق ............", a: ["جبل طارق"], note: "مضيق جبل طارق يصل بين المحيط الأطلنطي والبحر الأبيض المتوسط." },
        { q: "س19: المضيق الذي يصل بين الخليج العربي وخليج عمان هو مضيق ............", a: ["هرمز"], note: "مضيق هرمز تشرف عليه سلطنة عمان وإيران." },
        { q: "س20: المضيق الذي يصل بين البحر الأحمر وخليج عدن هو مضيق ............", a: ["باب المندب"], note: "مضيق باب المندب مضيق عربي خالص تشرف عليه اليمن وجيبوتي." },
        { q: "س21: النهر الذي يجري في جمهورية العراق هو نهر دجلة ونهر ............", a: ["الفرات"], note: "دجلة والفرات هما أصل السهول الفيضية في بلاد الرافدين (العراق)." },
        { q: "س22: تعد نسبة السكان في الحضر بالوطن العربي أكثر من نسبة سكان ............", a: ["الريف"], note: "تزداد نسبة الحضر في الوطن العربي نتيجة الهجرة المستمرة من الريف للمدن." },
        { q: "س23: الدولة العربية التي تحتل المرتبة الأولى من حيث عدد السكان هي ............", a: ["مصر"], note: "تعتبر مصر أكبر دولة عربية من حيث عدد السكان (تتجاوز 100 مليون)." },
        { q: "س24: من الحبوب الغذائية التي تزرع في الوطن العربي القمح و ............", a: ["الأرز", "الارز", "الذرة"], note: "القمح والأرز والذرة هي الحبوب الغذائية الأساسية بالوطن العربي." },
        { q: "س25: تعد دولة الأردن ومصر من الدول التي تستقبل السياحة ............", a: ["العلاجية"], note: "تنتشر السياحة العلاجية لوجود العيون الكبريتية والرمال الساخنة." },
        { q: "س26: الثروة الحيوانية التي تحتل السودان المرتبة الأولى في تربيتها هي ............", a: ["الماشيـة", "الماشية", "الأبقار"], note: "تمتلك السودان أكبر عدد من رؤوس الماشية والأبقار في الوطن العربي." },
        { q: "س27: أولى الدول العربية في إنتاج البترول هي المملكة العربية ............", a: ["السعودية"], note: "تتصدر السعودية إنتاج واحتياطي البترول على مستوى الوطن العربي والعالم." },
        { q: "س28: معدن يدخل في صناعة الأسمدة والمبيدات وتتصدر المغرب إنتاجه هو ............", a: ["الفوسفات"], note: "الفوسفات من أهم المعادن بالوطن العربي والمغرب الأولى عربياً." },
        { q: "س29: ينقسم الوطن العربي إلى جناحين هما الجناح الأفريقي والجناح ............", a: ["الآسيوي", "الاسيوي"], note: "يضم الوطن العربي 22 دولة مقسمة بين قارتي إفريقيا وآسيا." },
        { q: "س30: تبنّت الدول العربية خطة لزيادة المساحات الخضراء والتشجير لمواجهة التغيرات ............", a: ["المناخية", "المناخية."], note: "زيادة المساحات الخضراء تقلل الانبعاثات وتحارب ظاهرة التغير المناخي." }
    ];

    let currentQ = 0;
    let score = 0;
    let timerInterval;
    let timeLeft = 45;
    let studentName = "";
    let weaknesses = [];

    function startQuiz() {
        const nameInput = document.getElementById("student-name").value.trim();
        if (nameInput === "") {
            alert("لطفاً، أدخل اسم الطالب لكي تبدأ الامتحان!");
            return;
        }
        studentName = nameInput;
        document.getElementById("student-display").innerText = studentName;
        document.getElementById("student-section").style.display = "none";
        document.getElementById("quiz-section").style.display = "block";
        loadQuestion();
    }

    function loadQuestion() {
        if (currentQ >= quizData.length) {
            endQuiz();
            return;
        }

        document.getElementById("q-counter").innerText = currentQ + 1;
        document.getElementById("user-answer").value = "";
        document.getElementById("user-answer").disabled = false;
        document.getElementById("submit-btn").style.display = "block";
        document.getElementById("feedback").style.display = "none";

        const q = quizData[currentQ];
        document.getElementById("question-text").innerText = q.q;

        resetTimer();
    }

    function resetTimer() {
        clearInterval(timerInterval);
        timeLeft = 45;
        document.getElementById("timer").innerText = timeLeft;
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById("timer").innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                timeOutAnswer();
            }
        }, 1000);
    }

    function checkAnswer() {
        clearInterval(timerInterval);
        const userAns = document.getElementById("user-answer").value.trim().toLowerCase();
        const q = quizData[currentQ];
        const feedback = document.getElementById("feedback");

        document.getElementById("user-answer").disabled = true;
        document.getElementById("submit-btn").style.display = "none";

        let isCorrect = q.a.some(ans => userAns === ans.toLowerCase() || userAns.includes(ans.toLowerCase()));

        if (isCorrect) {
            score++;
            feedback.className = "feedback-box feedback-correct";
            feedback.innerHTML = `<strong>✨ إجابة ممتازة وصحيحة!</strong><br>${q.note}<br><button class="next-btn" onclick="nextQuestion()">السؤال التالي ⬅️</button><div style="clear:both;"></div>`;
        } else {
            weaknesses.push({ q: q.q, correct: q.a[0], note: q.note });
            feedback.className = "feedback-box feedback-incorrect";
            feedback.innerHTML = `<strong>❌ إجابة غير مكتملة أو خاطئة.</strong><br>الإجابة النموذجية هي: <strong>(${q.a[0]})</strong><br>💡 <em>شرح وملاحظة:</em> ${q.note}<br><button class="next-btn" onclick="nextQuestion()">السؤال التالي ⬅️</button><div style="clear:both;"></div>`;
        }
        feedback.style.display = "block";
    }

    function timeOutAnswer() {
        const q = quizData[currentQ];
        const feedback = document.getElementById("feedback");

        document.getElementById("user-answer").disabled = true;
        document.getElementById("submit-btn").style.display = "none";

        weaknesses.push({ q: q.q, correct: q.a[0], note: q.note });
        feedback.className = "feedback-box feedback-incorrect";
        feedback.innerHTML = `<strong>⏰ انتهى الوقت المخصص للسؤال!</strong><br>الإجابة الصحيحة: <strong>(${q.a[0]})</strong><br>💡 <em>المعلومة:</em> ${q.note}<br><button class="next-btn" onclick="nextQuestion()">السؤال التالي ⬅️</button><div style="clear:both;"></div>`;
        feedback.style.display = "block";
    }

    function nextQuestion() {
        currentQ++;
        loadQuestion();
    }

    function endQuiz() {
        document.getElementById("quiz-section").style.display = "none";
        document.getElementById("result-section").style.display = "block";
        document.getElementById("student-final-name").innerText = `الطالب(ة): ${studentName}`;
        document.getElementById("final-score").innerText = `درجتك: ${score} من 30`;

        const weaknessListDiv = document.getElementById("weakness-list");
        if (weaknesses.length === 0) {
            document.getElementById("weakness-area").style.borderRightColor = "#166534";
            weaknessListDiv.innerHTML = "<p style='color: #166534; font-weight: bold;'>ما شاء الله! إجاباتك كلها صحيحة 100% ولا توجد لديك أي نقاط ضعف 🎉</p>";
        } else {
            let listHTML = "<ul>";
            weaknesses.forEach(w => {
                listHTML += `<li style="margin-bottom: 8px;"><strong>${w.q.split(':')[0]}:</strong> الإجابة: (${w.correct}) - <em>${w.note}</em></li>`;
            });
            listHTML += "</ul>";
            weaknessListDiv.innerHTML = listHTML;
        }
    }
</script>

</body>
</html>
