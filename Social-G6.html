      type: "text",
      topic: "الدعم العربي والتعاون الإقليمي",
      question: "س30: ما المنظمة العربية التي تجمع كافة الدول العربية ومقرها القاهرة؟",
      modelAnswer: "جامعة الدول العربية.",
      keywords: ["جامعة", "الدول العربية"],
      easyTip: "تأسست جامعة الدول العربية عام 1945 ومقرها القاهرة."
    }
  ];

  let currentQ = 0;
  let timeLeft = 45;
  let timerInterval;

  function startQuiz() {
    let nameInput = document.getElementById("student-name").value.trim();
    if (!nameInput) {
      alert("برجاء كتابة اسمك الثلاثي للبدء!");
      return;
    }
    studentName = nameInput;
    document.getElementById("student-section").style.display = "none";
    document.getElementById("quiz-section").style.display = "block";
    document.getElementById("student-display").innerText = "👤 الطالب: " + studentName;
    loadQuestion();
  }

  function loadQuestion() {
    clearInterval(timerInterval);
    timeLeft = 45;
    document.getElementById("timer").innerText = `⏱️ المتبقي: ${timeLeft} ثانية`;
    
    document.getElementById("user-answer").value = "";
    document.getElementById("feedback").style.display = "none";
    document.getElementById("next-btn").style.display = "none";
    document.getElementById("submit-btn").style.display = "inline-block";
    document.getElementById("user-answer").disabled = false;

    let qData = questionBank[currentQ];
    document.getElementById("q-counter").innerText = `السؤال ${currentQ + 1} من ${questionBank.length}`;
    document.getElementById("question-text").innerText = qData.question;

    if (qData.type === "map") {
      document.getElementById("map-area").style.display = "block";
      document.getElementById("map-image").src = "https://upload.wikimedia.org/wikipedia/commons/2/22/Arab_World_location_map.svg";
    } else {
      document.getElementById("map-area").style.display = "none";
    }

    timerInterval = setInterval(() => {
      timeLeft--;
      document.getElementById("timer").innerText = `⏱️ المتبقي: ${timeLeft} ثانية`;
      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        checkAnswer(true);
      }
    }, 1000);
  }

  function checkAnswer(isTimeOut = false) {
    clearInterval(timerInterval);
    document.getElementById("user-answer").disabled = true;
    document.getElementById("submit-btn").style.display = "none";
    document.getElementById("next-btn").style.display = "inline-block";

    let uAns = document.getElementById("user-answer").value.trim();
    let qData = questionBank[currentQ];
    let feedbackEl = document.getElementById("feedback");

    let isCorrect = qData.keywords.some(kw => uAns.includes(kw));

    feedbackEl.style.display = "block";

    if (!isTimeOut && isCorrect) {
      score++;
      feedbackEl.className = "feedback-box feedback-correct";
      feedbackEl.innerHTML = `🎉 <strong>ممتاز يا ${studentName}! إجابة صحيحة.</strong><br>📌 <strong>الإجابة النموذجية:</strong> ${qData.modelAnswer}`;
    } else {
      wrongTopics.push(qData.topic);
      feedbackEl.className = "feedback-box feedback-incorrect";
      let reason = isTimeOut ? "انتهى الوقت المحدد!" : "الإجابة غير كاملة.";
      feedbackEl.innerHTML = `❌ <strong>حاول مرة أخرى يا ${studentName} (${reason})</strong><br>📌 <strong>الإجابة النموذجية الصحيحة:</strong> ${qData.modelAnswer}<br>💡 <strong>ملاحظة:</strong> <small>${qData.easyTip}</small>`;
    }
  }

  function nextQuestion() {
    currentQ++;
    if (currentQ < questionBank.length) {
      loadQuestion();
    } else {
      showFinalResult();
    }
  }

  function showFinalResult() {
    document.getElementById("quiz-section").style.display = "none";
    document.getElementById("result-section").style.display = "block";

    let total = questionBank.length;
    let percentage = Math.round((score / total) * 100);

    let scoreHeader = document.getElementById("score-header");
    let scoreDetails = document.getElementById("score-details");

    scoreHeader.innerHTML = `🎉 النتيجة النهائية للاختبار`;
    
    let evaluationMsg = "";
    if(percentage >= 85) {
      evaluationMsg = "ممتاز جداً وأداء رائع! 🌟";
    } else if(percentage >= 65) {
      evaluationMsg = "جيد جداً، مع الحاجة لبعض التركيز البسيط! 👍";
    } else {
      evaluationMsg = "يحتاج إلى المزيد من المراجعة والتدريب 📚";
    }

    scoreDetails.innerHTML = `
      <p style="font-size: 1.1rem;">يا <strong>${studentName}</strong>، درجتك هي: <strong>${score} من ${total}</strong></p>
      <p style="font-size: 1.1rem;">النسبة المئوية: <strong>${percentage}%</strong> — (${evaluationMsg})</p>
    `;

    if (wrongTopics.length > 0) {
      let weaknessReport = document.getElementById("weakness-report");
      let weaknessItems = document.getElementById("weakness-items");
      weaknessReport.style.display = "block";
      
      let uniqueTopics = [...new Set(wrongTopics)];
      weaknessItems.innerHTML = uniqueTopics.map(t => `<li>عليك إعادة مراجعة: <strong>${t}</strong></li>`).join("");
    }
  }
</script>

</html>
