<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الاختبارات والواجبات الذكية</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            margin: 0;
            padding: 0;
        }
        .header-admin {
            background-color: #1e4620;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 1.2em;
            font-weight: bold;
        }
        .container {
            max-width: 800px;
            margin: 20px auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .section-title {
            font-weight: bold;
            font-size: 1.1em;
            color: #2c3e50;
            margin-bottom: 10px;
        }
        .options-group {
            margin-bottom: 20px;
        }
        .options-group label {
            display: block;
            padding: 8px 0;
            cursor: pointer;
            font-size: 1em;
        }
        select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            font-size: 1em;
            margin-bottom: 15px;
            background-color: #fff;
        }
        hr {
            border: 0;
            border-top: 1px solid #e1e8ed;
            margin: 20px 0;
        }
        .success-box {
            display: none;
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .launch-btn {
            display: none;
            width: 100%;
            background-color: #1e4620;
            color: white;
            padding: 15px;
            font-size: 1.1em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: background 0.3s;
        }
        .launch-btn:hover {
            background-color: #143216;
        }
    </style>
</head>
<body>

<div class="header-admin">
    أهلاً بك يا فندم (admin) ⚡
</div>

<div class="container">
    <div class="section-title">اختر القسم المطلوب:</div>
    <div class="options-group">
        <label><input type="radio" name="section" checked> 📚 بنك الاختبارات التفاعلية</label>
        <label><input type="radio" name="section"> 🤖 مساعد الواجبات الذكي وتصحيحها</label>
        <label><input type="radio" name="section"> 📊 الملخصات والعروض التقديمية الذكية</label>
    </div>

    <hr>

    <div class="section-title">✏️ اختر المادة والصّف لتأدية الامتحان</div>
    
    <label>اختر المادة</label>
    <select id="subjectSelect" onchange="checkSelection()">
        <option value="">-- اختر المادة --</option>
        <option value="science">Science</option>
    </select>

    <label>اختر المرحلة</label>
    <div class="options-group">
        <label><input type="radio" name="stage" id="primaryStage" checked> المرحلة الابتدائية</label>
        <label><input type="radio" name="stage"> المرحلة الإعدادية</label>
    </div>

    <label>اختر الصّف</label>
    <select id="gradeSelect" onchange="checkSelection()">
        <option value="">-- اختر الصف --</option>
        <option value="g6">الصف السادس الابتدائي</option>
    </select>

    <!-- رسالة النجاح والزر المطابق لطلبك -->
    <div id="successBox" class="success-box">
        تم تجهيز مسار امتحان (Science - الصف السادس الابتدائي) بنجاح ✅
    </div>

    <a id="launchBtn" href="Scienceg6.html" target="_blank" class="launch-btn">
        اضغط هنا لبدء امتحان Science - الصف السادس الابتدائي 🚀 <br>
        <span style="font-size: 0.85em; font-weight: normal;">(سيتم فتح الامتحان في تبويب جديد تماماً)</span>
    </a>
</div>

<script>
    function checkSelection() {
        const subject = document.getElementById('subjectSelect').value;
        const grade = document.getElementById('gradeSelect').value;
        const successBox = document.getElementById('successBox');
        const launchBtn = document.getElementById('launchBtn');
        const primaryStage = document.getElementById('primaryStage').checked;

        if (subject === 'science' && grade === 'g6' && primaryStage) {
            successBox.style.display = 'block';
            launchBtn.style.display = 'block';
        } else {
            successBox.style.display = 'none';
            launchBtn.style.display = 'none';
        }
    }
</script>

</body>
</html>
