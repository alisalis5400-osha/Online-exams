<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>امتحان مادة Science - الصف السادس الابتدائي</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .exam-container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            color: #1e4620;
            text-align: center;
            margin-bottom: 25px;
        }
        .question-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .question-title {
            font-weight: bold;
            font-size: 1.1em;
            color: #2c3e50;
            margin-bottom: 15px;
        }
        .options label {
            display: block;
            padding: 10px;
            margin-bottom: 8px;
            background: #fff;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .options label:hover {
            background: #e2e8f0;
        }
        .submit-btn {
            display: block;
            width: 100%;
            background-color: #1e4620;
            color: white;
            padding: 15px;
            font-size: 1.2em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            margin-top: 30px;
            transition: background 0.3s;
        }
        .submit-btn:hover {
            background-color: #143216;
        }
        #result {
            text-align: center;
            font-size: 1.2em;
            font-weight: bold;
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="exam-container">
    <h1>🧪 امتحان مادة Science (الصف السادس الابتدائي)</h1>
    
    <form id="scienceExamForm" onsubmit="calculateScore(event)">
        
        <!-- السؤال الأول -->
        <div class="question-box">
            <div class="question-title">1. Which of the following is the control center of the cell?</div>
            <div class="options">
                <label><input type="radio" name="q1" value="wrong"> Cell membrane</label>
                <label><input type="radio" name="q1" value="correct"> Nucleus</label>
                <label><input type="radio" name="q1" value="wrong"> Cytoplasm</label>
                <label><input type="radio" name="q1" value="wrong"> Mitochondria</label>
            </div>
        </div>

        <!-- السؤال الثاني -->
        <div class="question-box">
            <div class="question-title">2. What is the process by which plants make their own food?</div>
            <div class="options">
                <label><input type="radio" name="q2" value="wrong"> Respiration</label>
                <label><input type="radio" name="q2" value="correct"> Photosynthesis</label>
                <label><input type="radio" name="q2" value="wrong"> Digestion</label>
                <label><input type="radio" name="q2" value="wrong"> Transpiration</label>
            </div>
        </div>

        <!-- السؤال الثالث -->
        <div class="question-box">
            <div class="question-title">3. The organelle responsible for energy production in the cell is:</div>
            <div class="options">
                <label><input type="radio" name="q3" value="correct"> Mitochondria</label>
                <label><input type="radio" name="q3" value="wrong"> Vacuole</label>
                <label><input type="radio" name="q3" value="wrong"> Cell wall</label>
                <label><input type="radio" name="q3" value="wrong"> Ribosome</label>
            </div>
        </div>

        <button type="submit" class="submit-btn">إرسال وتصحيح الامتحان 📋</button>
    </form>

    <div id="result"></div>
</div>

<script>
    function calculateScore(event) {
        event.preventDefault();
        let score = 0;
        let total = 3;

        const q1 = document.querySelector('input[name="q1"]:checked');
        const q2 = document.querySelector('input[name="q2"]:checked');
        const q3 = document.querySelector('input[name="q3"]:checked');

        if (q1 && q1.value === 'correct') score++;
        if (q2 && q2.value === 'correct') score++;
        if (q3 && q3.value === 'correct') score++;

        const resultDiv = document.getElementById('result');
        resultDiv.style.display = 'block';
        
        if (score === total) {
            resultDiv.style.backgroundColor = '#d4edda';
            resultDiv.style.color = '#155724';
            resultDiv.innerHTML = `ممتاز جداً! 🎉 درجتك هي ${score} من ${total} (100%)`;
        } else {
            resultDiv.style.backgroundColor = '#fff3cd';
            resultDiv.style.color = '#856404';
            resultDiv.innerHTML = `جيد جداً! 👏 درجتك هي ${score} من ${total}. حاولي مرة أخرى لتحقيق الدرجة النهائية!`;
        }
    }
</script>

</body>
</html>
