<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English - Grade 2 Preparatory (Unit 1) - Instant Feedback</title>
    <style>
        body {
            font-family: 'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #1b4d3e;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        .question-card {
            background: #fafa000a;
            border: 1px solid #e0e0e0;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .question-title {
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 15px;
            color: #2c3e50;
        }
        .options label {
            display: block;
            padding: 10px 15px;
            margin: 8px 0;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .options label:hover {
            background: #f0f7f4;
            border-color: #1b4d3e;
        }
        .options input {
            margin-left: 10px;
        }
        .check-btn {
            background-color: #1b4d3e;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95em;
            margin-top: 10px;
            font-weight: bold;
        }
        .check-btn:hover {
            background-color: #12352a;
        }
        .feedback {
            margin-top: 10px;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            display: none;
        }
        .feedback.correct {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        .feedback.incorrect {
            background-color: f8d7da;
            color: #721c24;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            display: block;
        }
        #score-section {
            text-align: center;
            font-size: 1.4em;
            font-weight: bold;
            color: #1b4d3e;
            margin-top: 30px;
            padding: 20px;
            background: #e8f4f1;
            border-radius: 10px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>English Exam - Grade 2 Prep</h1>
    <div class="subtitle">Unit 1 - Interactive Practice (Instant Feedback)</div>

    <form id="quizForm">
        <!-- السؤال الأول -->
        <div class="question-card" id="q1">
            <div class="question-title">1. What is the opposite of the word "ancient"?</div>
            <div class="options">
                <label><input type="radio" name="q1" value="A"> A) Old</label>
                <label><input type="radio" name="q1" value="B"> B) Modern</label>
                <label><input type="radio" name="q1" value="C"> C) Historic</label>
                <label><input type="radio" name="q1" value="D"> D) Ancient</label>
            </div>
            <button type="button" class="check-btn" onclick="checkAnswer(1, 'B')">تأكد من الإجابة</button>
            <div class="feedback" id="feedback1"></div>
        </div>

        <!-- السؤال الثاني -->
        <div class="question-card" id="q2">
            <div class="question-title">2. We usually ______ breakfast at 7:00 AM every day.</div>
            <div class="options">
                <label><input type="radio" name="q2" value="A"> A) having</label>
                <label><input type="radio" name="q2" value="B" data-correct="true"> B) have</label>
                <label><input type="radio" name="q2" value="C"> C) has</label>
                <label><input type="radio" name="q2" value="D"> D) had</label>
            </div>
            <button type="button" class="check-btn" onclick="checkAnswer(2, 'B')">تأكد من الإجابة</button>
            <div class="feedback" id="feedback2"></div>
        </div>

        <!-- السؤال الثالث -->
        <div class="question-card" id="q3">
            <div class="question-title">3. Listen! The baby ______ in the next room.</div>
            <div class="options">
                <label><input type="radio" name="q3" value="A"> A) cry</label>
                <label><input type="radio" name="q3" value="B"> B) cries</label>
                <label><input type="radio" name="q3" value="C" data-correct="true"> C) is crying</label>
                <label><input type="radio" name="q3" value="D"> D) cried</label>
            </div>
            <button type="button" class="check-btn" onclick="checkAnswer(3, 'C')">تأكد من الإجابة</button>
            <div class="feedback" id="feedback3"></div>
        </div>

        <!-- يمكنك إضافة باقي الـ 90 سؤال بنفس الطريقة المنتظمة هنا -->
    </form>

    <div id="score-section">
        🎉 لقد أتممت الأسئلة! مجموع درجاتك الحالية: <span id="finalScore">0</span>
    </div>
</div>

<script>
    // خريطة لتسجيل الأسئلة التي تم الإجابة عليها صحيحة لعدم تكرار احتساب النقاط
    const answeredCorrectly = {};

    function checkAnswer(questionNum, correctAnswer) {
        const radios = document.getElementsByName('q' + questionNum);
        let selectedValue = null;

        for (const radio of radios) {
            if (radio.checked) {
                selectedValue = radio.value;
                break;
            }
        }

        const feedbackDiv = document.getElementById('feedback' + questionNum);

        if (!selectedValue) {
            feedbackDiv.className = "feedback incorrect";
            feedbackDiv.innerText = "الرجاء اختيار إجابة أولاً! ⚠️";
            return;
        }

        if (selectedValue === correctAnswer) {
            feedbackDiv.className = "feedback correct";
            feedbackDiv.innerText = "إجابة صحيحة! برافو عليك 🌟";
            
            if (!answeredCorrectly[questionNum]) {
                answeredCorrectly[questionNum] = true;
            }
        } else {
            feedbackDiv.className = "feedback incorrect";
            feedbackDiv.innerText = "إجابة خاطئة، الإجابة الصحيحة هي: " + correctAnswer + " ❌";
            answeredCorrectly[questionNum] = false;
        }

        updateScore();
    }

    function updateScore() {
        let score = 0;
        for (let key in answeredCorrectly) {
            if (answeredCorrectly[key]) {
                score++;
            }
        }
        const scoreSection = document.getElementById('score-section');
        const finalScoreSpan = document.getElementById('finalScore');
        
        scoreSection.style.display = "block";
        finalScoreSpan.innerText = score;
    }
</script>

</body>
</html>
