<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الاختبارات والواجبات الذكية</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            margin: 0;
            padding: 0;
        }
        .header-admin {
            background-color: #1e4620;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 1.2em;
            font-weight: bold;
        }
        .container {
            max-width: 800px;
            margin: 20px auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .section-title {
            font-weight: bold;
            font-size: 1.1em;
            color: #2c3e50;
            margin-bottom: 10px;
        }
        .options-group {
            margin-bottom: 20px;
        }
        .options-group label {
            display: block;
            padding: 8px 0;
            cursor: pointer;
            font-size: 1em;
        }
        select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            font-size: 1em;
            margin-bottom: 15px;
            background-color: #fff;
        }
        hr {
            border: 0;
            border-top: 1px solid #e1e8ed;
            margin: 20px 0;
        }
        .launch-btn {
            display: block;
            width: 100%;
            background-color: #1e4620;
            color: white;
            padding: 15px;
            font-size: 1.1em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: background 0.3s;
            margin-top: 15px;
        }
        .launch-btn:hover {
            background-color: #143216;
        }
    </style>
</head>
<body>

<div class="header-admin">
    أهلاً بك يا فندم (admin) ⚡
</div>

<div class="container">
    <div class="section-title">اختر القسم المطلوب:</div>
    <div class="options-group">
        <label><input type="radio" name="section" checked> 📚 بنك الاختبارات التفاعلية</label>
        <label><input type="radio" name="section"> 🤖 مساعد الواجبات الذكي وتصحيحها</label>
        <label><input type="radio" name="section"> 📊 الملخصات والعروض التقديمية الذكية</label>
    </div>

    <hr>

    <div class="section-title">✏️ اختر المادة لتأدية الامتحان مباشرة</div>
    
    <label>اختر المادة المطلوبة:</label>
    <select id="subjectSelect">
        <option value="Scienceg6.html">Science - الصف السادس الابتدائي</option>
        <option value="Social-G6.html">الدراسات الاجتماعية - الصف السادس الابتدائي</option>
        <option value="engprep2.html">اللغة الإنجليزية - الصف الثاني الإعدادي</option>
    </select>

    <!-- زر فتح الامتحان المباشر -->
    <a id="launchBtn" href="#" target="_blank" class="launch-btn">
        اضغط هنا لبدء الامتحان 🚀
    </a>
</div>

<script>
    const selectBox = document.getElementById('subjectSelect');
    const launchBtn = document.getElementById('launchBtn');

    function updateLink() {
        launchBtn.href = selectBox.value;
    }

    selectBox.addEventListener('change', updateLink);
    
    // تعيين الرابط الافتراضي فور فتح الصفحة
    updateLink();
</script>

</body>
</html>
